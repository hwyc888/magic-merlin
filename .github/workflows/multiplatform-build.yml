name: Build MagicTier Windows Linux and ARM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'magictier/**'
      - '.github/workflows/multiplatform-build.yml'
      - '.github/scripts/smoke_multiplatform.py'
      - '.github/MULTIPLATFORM-README.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: magictier-multiplatform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Resolve one shared dependency lock for all four targets
        working-directory: magictier
        run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: magictier-build-lockfile
          path: magictier/Cargo.lock
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    needs: dependencies
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: x86_64-pc-windows-msvc

      - name: Download shared dependency lock
        uses: actions/download-artifact@v4
        with:
          name: magictier-build-lockfile
          path: magictier

      - name: Build Windows x64 core
        working-directory: magictier
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin magictier-core --bin magictier-cli

      - name: Build size-optimized Windows CLI with all default features
        working-directory: magictier
        run: cargo build --locked --profile cli-small --target x86_64-pc-windows-msvc --bin magictier-cli

      - name: Verify and package Windows binaries and runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "magictier/target/x86_64-pc-windows-msvc/release"
          $core = "$release/magictier-core.exe"
          $cli = "magictier/target/x86_64-pc-windows-msvc/cli-small/magictier-cli.exe"
          if (!(Test-Path $core)) { throw "missing $core" }
          if (!(Test-Path $cli)) { throw "missing $cli" }
          New-Item -ItemType Directory -Force -Path out/windows-x64 | Out-Null
          Copy-Item $core out/windows-x64/magictier-core.exe
          Copy-Item $cli out/windows-x64/magictier-cli.exe
          foreach ($dependency in @("Packet.dll", "wintun.dll", "WinDivert64.sys")) {
            Copy-Item "magictier/third_party/x86_64/$dependency" "out/windows-x64/$dependency"
            Copy-Item "magictier/third_party/x86_64/$dependency" "$release/$dependency"
          }
          Copy-Item magictier/Cargo.lock out/windows-x64/Cargo.lock
          python .github/scripts/smoke_multiplatform.py --core out/windows-x64/magictier-core.exe --cli out/windows-x64/magictier-cli.exe --baseline "$release/magictier-cli.exe" --report out/windows-x64/BUILD-REPORT.json
          if ($LASTEXITCODE -ne 0) { throw "Windows binary validation failed" }
          Get-Item out/windows-x64/* | Select-Object Name,Length

      - name: Preserve diagnostic binaries if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-windows-x64
          path: out/windows-x64/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: magictier-windows-x64
          path: out/windows-x64/*
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: dependencies
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            target: x86_64-unknown-linux-musl
            out: linux-x64
            arch_pattern: 'x86-64'
            runner: ''
          - name: Linux ARM64
            target: aarch64-unknown-linux-musl
            out: linux-arm64
            arch_pattern: 'ARM aarch64'
            runner: qemu-aarch64
          - name: Linux ARMv7
            target: armv7-unknown-linux-musleabihf
            out: linux-armv7
            arch_pattern: 'ARM, EABI5'
            runner: qemu-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y file musl-tools protobuf-compiler qemu-user time

      - name: Install Rust 1.89 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Download shared dependency lock
        uses: actions/download-artifact@v4
        with:
          name: magictier-build-lockfile
          path: magictier

      - name: Build Linux core
        working-directory: magictier
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} --bin magictier-core --bin magictier-cli

      - name: Build size-optimized Linux CLI with all default features
        working-directory: magictier
        run: cargo zigbuild --locked --profile cli-small --target ${{ matrix.target }} --bin magictier-cli

      - name: Verify Linux binaries
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ matrix.out }}
          ARCH_PATTERN: ${{ matrix.arch_pattern }}
        run: |
          set -eux
          core="magictier/target/${TARGET}/release/magictier-core"
          cli="magictier/target/${TARGET}/cli-small/magictier-cli"
          test -x "${core}"
          test -x "${cli}"
          file "${core}" | tee /tmp/core-file.txt
          file "${cli}" | tee /tmp/cli-file.txt
          grep -q "${ARCH_PATTERN}" /tmp/core-file.txt
          grep -q "${ARCH_PATTERN}" /tmp/cli-file.txt
          grep -Eq 'statically linked|static-pie linked' /tmp/core-file.txt
          grep -Eq 'statically linked|static-pie linked' /tmp/cli-file.txt
          mkdir -p "out/${OUT}"
          install -m 0755 "${core}" "out/${OUT}/magictier-core"
          install -m 0755 "${cli}" "out/${OUT}/magictier-cli"
          cp magictier/Cargo.lock "out/${OUT}/Cargo.lock"
          ls -lh "out/${OUT}"

      - name: Validate CLI parity and native RPC or QEMU startup
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ matrix.out }}
          RUNNER: ${{ matrix.runner }}
        run: |
          python3 .github/scripts/smoke_multiplatform.py \
            --core "out/${OUT}/magictier-core" \
            --cli "out/${OUT}/magictier-cli" \
            --baseline "magictier/target/${TARGET}/release/magictier-cli" \
            --runner "${RUNNER}" --report "out/${OUT}/BUILD-REPORT.json"

      - name: Preserve diagnostic binaries if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ matrix.out }}
          path: out/${{ matrix.out }}/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux target
        uses: actions/upload-artifact@v4
        with:
          name: magictier-${{ matrix.out }}
          path: out/${{ matrix.out }}/*
          if-no-files-found: error
          retention-days: 30

  package:
    runs-on: ubuntu-24.04
    needs: [windows-x64, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: magictier-*
          path: DIST

      - name: Normalize package layout and checksums
        run: |
          set -eux
          find DIST -maxdepth 3 -type f -print
          mkdir -p package/windows-x64 package/linux-x64 package/linux-arm64 package/linux-armv7
          cp DIST/magictier-windows-x64/* package/windows-x64/
          cp DIST/magictier-linux-x64/* package/linux-x64/
          cp DIST/magictier-linux-arm64/* package/linux-arm64/
          cp DIST/magictier-linux-armv7/* package/linux-armv7/
          cp magictier/LICENSE package/LICENSE
          cp .github/MULTIPLATFORM-README.md package/README.md
          for platform in linux-x64 linux-arm64 linux-armv7; do
            chmod 0755 "package/${platform}/magictier-core" "package/${platform}/magictier-cli"
          done
          cmp package/windows-x64/Cargo.lock package/linux-x64/Cargo.lock
          cmp package/linux-arm64/Cargo.lock package/linux-x64/Cargo.lock
          cmp package/linux-armv7/Cargo.lock package/linux-x64/Cargo.lock
          (cd package && sha256sum README.md LICENSE windows-x64/* linux-x64/* linux-arm64/* linux-armv7/* > SHA256SUMS.txt)
          find package -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Upload complete multi-platform package
        uses: actions/upload-artifact@v4
        with:
          name: magic-merlin-multiplatform
          path: package/**
          if-no-files-found: error
          retention-days: 30

      - name: Keep latest two successful multi-platform runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          workflow = "multiplatform-build.yml"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "magic-merlin-multiplatform-cleanup",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          runs = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/actions/workflows/"
                  f"{workflow}/runs?per_page=100&page={page}"
              )
              batch = get_json(url).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          previous_successes = sorted(
              (
                  run
                  for run in runs
                  if int(run["id"]) != current_run_id
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ),
              key=lambda run: (run.get("created_at", ""), int(run["id"])),
              reverse=True,
          )
          keep_ids = {current_run_id}
          if previous_successes:
              keep_ids.add(int(previous_successes[0]["id"]))

          print(f"Keeping successful run IDs: {sorted(keep_ids, reverse=True)}")
          for run in runs:
              run_id = int(run["id"])
              if run_id in keep_ids or run.get("status") != "completed":
                  continue
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      response.read()
                  print(f"Deleted old completed run {run_id}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"Run {run_id} was already deleted")
                      continue
                  raise
          PY
