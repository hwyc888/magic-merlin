name: Build ASUS Router ARMv7 and ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'magictier/**'
      - 'router-plugin/**'
      - '.github/workflows/router-build.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: router-build-main
  cancel-in-progress: true

jobs:
  build-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether core rebuild is required
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUILD_CORE=true
          BASE_SHA="${{ github.event.before }}"
          case "${BASE_SHA}" in
            ''|0000000000000000000000000000000000000000)
              BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
              ;;
          esac

          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- magictier/; then
              BUILD_CORE=false
            fi
          fi

          ARTIFACT_ID=""
          if [ "${BUILD_CORE}" = "false" ]; then
            RUNS_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/router-build.yml/runs?branch=main&status=success&per_page=20")"
            PREV_RUN_ID="$(printf '%s' "${RUNS_JSON}" | python3 -c 'import json,sys; data=json.load(sys.stdin); current=int(sys.argv[1]); print(next((str(r["id"]) for r in data.get("workflow_runs",[]) if int(r["id"]) != current), ""))' "${GITHUB_RUN_ID}")"
            if [ -n "${PREV_RUN_ID}" ]; then
              ARTIFACTS_JSON="$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREV_RUN_ID}/artifacts?per_page=100")"
              ARTIFACT_ID="$(printf '%s' "${ARTIFACTS_JSON}" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((str(a["id"]) for a in data.get("artifacts",[]) if a.get("name")=="magic-merlin-asus-router" and not a.get("expired")), ""))')"
            fi
            if [ -z "${ARTIFACT_ID}" ]; then
              echo "No reusable core artifact found; falling back to a core rebuild."
              BUILD_CORE=true
            fi
          fi

          echo "build_core=${BUILD_CORE}" >> "${GITHUB_OUTPUT}"
          echo "artifact_id=${ARTIFACT_ID}" >> "${GITHUB_OUTPUT}"
          if [ "${BUILD_CORE}" = "true" ]; then
            echo "Core source: rebuild (magictier/ changed or no reusable artifact)."
          else
            echo "Core source: reuse artifact ${ARTIFACT_ID}; magictier/ is unchanged."
          fi

      - name: Install build tools
        if: steps.core.outputs.build_core == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config file binutils

      - name: Install Rust 1.89 router musl targets
        if: steps.core.outputs.build_core == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - name: Install Zig
        if: steps.core.outputs.build_core == 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: steps.core.outputs.build_core == 'true'
        run: cargo install cargo-zigbuild --locked

      - name: Build static router binaries
        if: steps.core.outputs.build_core == 'true'
        working-directory: magictier
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          cargo zigbuild --profile router --target aarch64-unknown-linux-musl --bin magictier-core
          cargo zigbuild --profile router --target armv7-unknown-linux-musleabihf --bin magictier-core

      - name: Reuse last verified router core binaries
        if: steps.core.outputs.build_core == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.core.outputs.artifact_id }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/magic-core-base
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/magic-core-base.zip
          unzip -q /tmp/magic-core-base.zip -d /tmp/magic-core-base

          TUF_PKG="$(find /tmp/magic-core-base -maxdepth 1 -type f -name 'magic-TUF-BE3600-V2-koolcenter-armv7.tar.gz' -print -quit)"
          RT_PKG="$(find /tmp/magic-core-base -maxdepth 1 -type f -name 'magic-RT-AX86U-koolcenter-arm64.tar.gz' -print -quit)"
          test -n "${TUF_PKG}"
          test -n "${RT_PKG}"

          mkdir -p \
            magictier/target/armv7-unknown-linux-musleabihf/router \
            magictier/target/aarch64-unknown-linux-musl/router
          tar -xOzf "${TUF_PKG}" magic/bin/magic-core > magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core
          tar -xOzf "${RT_PKG}" magic/bin/magic-core > magictier/target/aarch64-unknown-linux-musl/router/magictier-core
          chmod 0755 \
            magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core \
            magictier/target/aarch64-unknown-linux-musl/router/magictier-core

      - name: Verify router binaries
        run: |
          set -eux
          for CORE in \
            magictier/target/aarch64-unknown-linux-musl/router/magictier-core \
            magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core
          do
            test -x "$CORE"
            file "$CORE"
            ls -lh "$CORE"
            stat -c 'magictier-core bytes=%s' "$CORE"
            readelf -h "$CORE" | grep -E 'Class:|Machine:'
            if readelf -l "$CORE" | grep -q 'Requesting program interpreter'; then
              echo "ERROR: ${CORE} is dynamically linked"
              exit 1
            fi
          done
          file magictier/target/aarch64-unknown-linux-musl/router/magictier-core | grep -q 'ARM aarch64'
          file magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core | grep -Eq 'ARM, EABI5|ARM, EABI'

      - name: Verify KoolCenter plugin template
        run: |
          set -eux
          test -f router-plugin/install.sh
          test -f router-plugin/uninstall.sh
          test -f router-plugin/.valid
          test -f router-plugin/config.json.js
          test -f router-plugin/scripts/magic_config.sh
          test -f router-plugin/scripts/magic_health.sh
          test -f router-plugin/webs/Module_magic.asp
          grep -qx 'hnd' router-plugin/.valid
          sh -n router-plugin/install.sh
          sh -n router-plugin/uninstall.sh
          sh -n router-plugin/scripts/magic_config.sh
          sh -n router-plugin/scripts/magic_health.sh
          ! grep -q 'killall magictier-core' router-plugin/scripts/magic_config.sh
          grep -q -- '--console-log-level warn --file-log-level off --dev-name magic0' router-plugin/scripts/magic_config.sh
          grep -q 'magic_log_max_bytes' router-plugin/scripts/magic_config.sh
          grep -q 'magic_rss_limit_kb' router-plugin/scripts/magic_config.sh
          ! grep -q 'magictier-cli' router-plugin/install.sh
          grep -q 'armv7l' router-plugin/install.sh
          ! grep -q 'import_from_clipboard' router-plugin/webs/Module_magic.asp
          ! grep -q '从剪贴板导入' router-plugin/webs/Module_magic.asp
          grep -q 'import_config_text' router-plugin/webs/Module_magic.asp
          grep -q 'show_config' router-plugin/webs/Module_magic.asp
          grep -q 'download_config_text' router-plugin/webs/Module_magic.asp
          grep -q 'OLD_NETWORK_SECRET' router-plugin/install.sh
          grep -q '升级后将原样保留' router-plugin/install.sh
          ! grep -q 'dbus remove magictier' router-plugin/install.sh
          grep -q -- '--hostname' router-plugin/scripts/magic_config.sh
          grep -q -- '--instance-name' router-plugin/scripts/magic_config.sh
          grep -q 'MAGICTIER_USER_EVENT_LOG' router-plugin/scripts/magic_config.sh
          grep -q 'magic_internal.log' router-plugin/scripts/magic_config.sh
          grep -q '组网状态日志' router-plugin/webs/Module_magic.asp
          grep -q '已成功加入网络' magictier/src/instance_manager.rs
          grep -q 'DEFAULT_CONN_REEVALUATE_SECS: u64 = 30' magictier/src/peers/peer.rs
          grep -q 'DEFAULT_CONN_MIN_IMPROVEMENT_US: u64 = 10_000' magictier/src/peers/peer.rs
          grep -q 'DEFAULT_CONN_ACTIVE_BYTES_THRESHOLD: u64 = 4 \* 1024' magictier/src/peers/peer.rs
          grep -q 'current_path_active' magictier/src/peers/peer.rs
          test "$(cat router-plugin/version)" = "1.2.0"
          grep -q '"version": "1.2.0"' router-plugin/config.json.js
          grep -q 'var target="/Module_Softcenter.asp#/"' router-plugin/webs/Module_magic.asp
          grep -q 'window.top.location.replace(target)' router-plugin/webs/Module_magic.asp
          grep -q 'onunload="unloadPage();"' router-plugin/webs/Module_magic.asp
          grep -q 'target="_top"' router-plugin/webs/Module_magic.asp
          grep -q 'INSTALL_DIR="/koolshare/magic"' router-plugin/install.sh
          grep -q 'OWNER_MARKER="${INSTALL_DIR}/.magic-owned"' router-plugin/install.sh
          grep -q 'LEGACY_OWNER_MARKER="${INSTALL_DIR}/.magictier-owned"' router-plugin/install.sh
          grep -q '本次安装已取消' router-plugin/install.sh
          grep -q 'namespace_conflict_test' router-plugin/install.sh
          grep -q 'softcenter_module_magic_install' router-plugin/install.sh
          grep -q '检测到原 magictier 插件' router-plugin/install.sh
          ! grep -q '/koolshare/magictier' router-plugin/install.sh
          ! grep -q '/koolshare/magictier' router-plugin/uninstall.sh
          ! grep -q 'dbus set magictier_' router-plugin/install.sh
          ! grep -q '/koolshare/scripts/magictier_config.sh' router-plugin/install.sh
          ! grep -q '/koolshare/webs/Module_magictier.asp' router-plugin/install.sh
          ! grep -q '/koolshare/res/icon-magictier.png' router-plugin/install.sh
          test -s router-plugin/res/magic.png
          file router-plugin/res/magic.png | grep -q 'PNG image data'
          grep -q 'res/magic.png' router-plugin/install.sh
          grep -q '/res/icon-magic.png' router-plugin/webs/Module_magic.asp
          grep -q 'RSS_LIMIT_KB="${magic_rss_limit_kb:-65536}"' router-plugin/scripts/magic_config.sh
          grep -q 'RSS_HARD_LIMIT_KB="${magic_rss_hard_limit_kb:-98304}"' router-plugin/scripts/magic_config.sh
          grep -q 'RSS_OVER_LIMIT_MAX=3' router-plugin/scripts/magic_config.sh
          grep -q 'sleep 20' router-plugin/scripts/magic_config.sh
          grep -q 'RSS_RESTART_MAX=3' router-plugin/scripts/magic_config.sh
          grep -q 'CRASH_RESTART_MAX=3' router-plugin/scripts/magic_config.sh
          grep -q 'CRASH_RESTART_STATE="/tmp/magic_crash_restart.state"' router-plugin/scripts/magic_config.sh
          grep -q 'STOP_MARKER="/tmp/magic_intentional_stop"' router-plugin/scripts/magic_config.sh
          grep -q '检测到 MagicTier 核心程序异常退出' router-plugin/scripts/magic_config.sh
          grep -q '正在自动恢复组网连接，不会重启路由器' router-plugin/scripts/magic_config.sh
          grep -q '连续异常超过3次' router-plugin/scripts/magic_config.sh
          grep -q '插件启用后自动守护核心进程' router-plugin/webs/Module_magic.asp
          ! grep -q '实时进程守护' router-plugin/webs/Module_magic.asp
          grep -q 'get_wan_ipv4' router-plugin/scripts/magic_config.sh
          grep -q 'WAN 地址变化' router-plugin/scripts/magic_config.sh
          grep -q 'WAN 连接恢复' router-plugin/scripts/magic_config.sh
          grep -q '不主动重启核心' router-plugin/scripts/magic_config.sh
          grep -q 'WAN_WAS_DOWN=0' router-plugin/scripts/magic_config.sh
          ! grep -q 'nice -n 5' router-plugin/scripts/magic_config.sh
          grep -q 'sh /koolshare/scripts/magic_config.sh boot' router-plugin/scripts/magic_config.sh
          grep -q 'is_init_invocation' router-plugin/scripts/magic_config.sh
          grep -q '/koolshare/init.d/S97magic.sh' router-plugin/install.sh
          grep -q '/koolshare/init.d/N97magic.sh' router-plugin/install.sh
          grep -q '不会重启路由器' router-plugin/scripts/magic_config.sh
          ! grep -qi 'reboot' router-plugin/scripts/magic_config.sh
          grep -q 'RSS_LIMIT_CURRENT.*262144' router-plugin/install.sh
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('router-plugin/webs/Module_magic.asp', 'utf8');
          const scripts = [...html.matchAll(/<script type="text\/javascript">([\s\S]*?)<\/script>/g)];
          const app = scripts.map(x => x[1]).find(x => x.includes('var db_magic'));
          if (!app) throw new Error('MagicTier inline JavaScript not found');
          const fields = {
            magic_hostname: {value: 'router-a'},
            magic_instance_name: {value: 'default'},
            magic_network_name: {value: 'company_vpn'},
            magic_network_secret: {value: 'sec\\ret"1'},
            magic_ipv4: {value: '10.126.126.50/24'},
            magic_listeners: {value: 'tcp://0.0.0.0:11010,udp://0.0.0.0:11010'},
            magic_peers: {value: 'reality://1.2.3.4:443,tcp://5.6.7.8:11010'},
            magic_proxy_networks: {value: '192.168.50.0/24,10.8.0.0/24'}
          };
          global.document = {getElementById: id => fields[id] || {}};
          global.navigator = {};
          global.window = {};
          global.alert = () => {};
          eval(app);
          const expectedSecret = fields.magic_network_secret.value;
          const exported = build_config_text();
          Object.values(fields).forEach(x => x.value = '');
          if (!import_config_text(exported)) throw new Error('exported config cannot be imported');
          if (fields.magic_network_name.value !== 'company_vpn') throw new Error('network name round-trip failed');
          if (fields.magic_network_secret.value !== expectedSecret) throw new Error('network secret round-trip failed');
          if (fields.magic_listeners.value !== 'tcp://0.0.0.0:11010,udp://0.0.0.0:11010') throw new Error('listeners round-trip failed');
          if (fields.magic_peers.value !== 'reality://1.2.3.4:443,tcp://5.6.7.8:11010') throw new Error('peers round-trip failed');
          if (fields.magic_proxy_networks.value !== '192.168.50.0/24,10.8.0.0/24') throw new Error('proxy networks round-trip failed');
          fields.magic_network_secret.value = '';
          fields.magic_listeners.value = '';
          fields.magic_peers.value = '';
          fields.magic_proxy_networks.value = '';
          const exportedEmpty = build_config_text();
          fields.magic_network_secret.value = 'old-secret';
          fields.magic_listeners.value = 'tcp://old:11010';
          fields.magic_peers.value = 'tcp://old:11010';
          fields.magic_proxy_networks.value = '172.16.0.0/16';
          if (!import_config_text(exportedEmpty)) throw new Error('empty config cannot be imported');
          if (fields.magic_network_secret.value !== '') throw new Error('empty network secret restore failed');
          if (fields.magic_listeners.value !== '') throw new Error('empty listeners restore failed');
          if (fields.magic_peers.value !== '') throw new Error('empty peers restore failed');
          if (fields.magic_proxy_networks.value !== '') throw new Error('empty proxy networks restore failed');
          NODE

      - name: Create router packages
        run: |
          set -eux
          rm -rf DIST
          mkdir -p DIST/TUF-BE3600-V2/magic DIST/RT-AX86U/magic

          cp -a router-plugin/. DIST/TUF-BE3600-V2/magic/
          cp -a router-plugin/. DIST/RT-AX86U/magic/
          mkdir -p DIST/TUF-BE3600-V2/magic/bin DIST/RT-AX86U/magic/bin

          install -m 0755 magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core DIST/TUF-BE3600-V2/magic/bin/magic-core
          install -m 0755 magictier/target/aarch64-unknown-linux-musl/router/magictier-core DIST/RT-AX86U/magic/bin/magic-core

          chmod 0755 DIST/*/magic/install.sh DIST/*/magic/uninstall.sh DIST/*/magic/scripts/magic_config.sh DIST/*/magic/scripts/magic_health.sh
          printf '%s\n' 'TUF-BE3600 V2 / TUF_3600_V2 (ARMv7)' > DIST/TUF-BE3600-V2/magic/target-model.txt
          printf '%s\n' 'RT-AX86U (ARM64)' > DIST/RT-AX86U/magic/target-model.txt

          tar -C DIST/TUF-BE3600-V2 -czf DIST/magic-TUF-BE3600-V2-koolcenter-armv7.tar.gz magic
          tar -C DIST/RT-AX86U -czf DIST/magic-RT-AX86U-koolcenter-arm64.tar.gz magic

          for pkg in DIST/*.tar.gz; do
            echo "Checking ${pkg}"
            tar -tzf "${pkg}" | grep -qx 'magic/install.sh'
            tar -tzf "${pkg}" | grep -qx 'magic/.valid'
            tar -tzf "${pkg}" | grep -qx 'magic/bin/magic-core'
            ! tar -tzf "${pkg}" | grep -q 'magic/bin/magic-cli'
            tar -tzf "${pkg}" | grep -qx 'magic/scripts/magic_config.sh'
            tar -tzf "${pkg}" | grep -qx 'magic/webs/Module_magic.asp'
            tar -tzf "${pkg}" | grep -qx 'magic/res/magic.png'
          done

          sha256sum DIST/*.tar.gz > DIST/SHA256SUMS.txt
          ls -lh DIST/*.tar.gz DIST/SHA256SUMS.txt
          stat -c '%n bytes=%s' DIST/*.tar.gz

      - name: Upload router packages
        uses: actions/upload-artifact@v4
        with:
          name: magic-merlin-asus-router
          path: |
            DIST/*.tar.gz
            DIST/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Keep latest two successful workflow runs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          workflow = "router-build.yml"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "magic-merlin-workflow-cleanup",
          }

          def request_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          runs = []
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/actions/workflows/"
                  f"{workflow}/runs?per_page=100&page={page}"
              )
              batch = request_json(url).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          previous_successes = sorted(
              (
                  run
                  for run in runs
                  if int(run["id"]) != current_run_id
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
              ),
              key=lambda run: (run.get("created_at", ""), int(run["id"])),
              reverse=True,
          )
          keep_ids = {current_run_id}
          if previous_successes:
              keep_ids.add(int(previous_successes[0]["id"]))

          print(f"Keeping successful run IDs: {sorted(keep_ids, reverse=True)}")
          for run in runs:
              run_id = int(run["id"])
              if run_id in keep_ids or run.get("status") != "completed":
                  continue
              delete_url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
              request = urllib.request.Request(delete_url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(request) as response:
                      response.read()
                  print(f"Deleted old completed run {run_id}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"Run {run_id} was already deleted")
                      continue
                  raise
          PY
