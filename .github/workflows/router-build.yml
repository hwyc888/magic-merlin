name: Build ASUS Router ARMv7 and ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'magictier/**'
      - 'router-plugin/**'
      - '.github/workflows/router-build.yml'

permissions:
  contents: read

jobs:
  build-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang pkg-config file binutils

      - name: Install Rust 1.89 router musl targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build static router binaries
        working-directory: magictier
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          cargo zigbuild --profile router --target aarch64-unknown-linux-musl --bin magictier-core
          cargo zigbuild --profile router --target armv7-unknown-linux-musleabihf --bin magictier-core

      - name: Verify router binaries
        run: |
          set -eux
          for CORE in \
            magictier/target/aarch64-unknown-linux-musl/router/magictier-core \
            magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core
          do
            test -x "$CORE"
            file "$CORE"
            ls -lh "$CORE"
            stat -c 'magictier-core bytes=%s' "$CORE"
            readelf -h "$CORE" | grep -E 'Class:|Machine:'
            if readelf -l "$CORE" | grep -q 'Requesting program interpreter'; then
              echo "ERROR: ${CORE} is dynamically linked"
              exit 1
            fi
          done
          file magictier/target/aarch64-unknown-linux-musl/router/magictier-core | grep -q 'ARM aarch64'
          file magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core | grep -Eq 'ARM, EABI5|ARM, EABI'

      - name: Verify KoolCenter plugin template
        run: |
          set -eux
          test -f router-plugin/install.sh
          test -f router-plugin/uninstall.sh
          test -f router-plugin/.valid
          test -f router-plugin/config.json.js
          test -f router-plugin/scripts/magictier_config.sh
          test -f router-plugin/scripts/magictier_health.sh
          test -f router-plugin/webs/Module_magictier.asp
          grep -qx 'hnd' router-plugin/.valid
          sh -n router-plugin/install.sh
          sh -n router-plugin/uninstall.sh
          sh -n router-plugin/scripts/magictier_config.sh
          sh -n router-plugin/scripts/magictier_health.sh
          ! grep -q 'killall magictier-core' router-plugin/scripts/magictier_config.sh
          grep -q -- '--console-log-level warn --file-log-level off' router-plugin/scripts/magictier_config.sh
          grep -q 'magictier_log_max_bytes' router-plugin/scripts/magictier_config.sh
          grep -q 'magictier_rss_limit_kb' router-plugin/scripts/magictier_config.sh
          ! grep -q 'magictier-cli' router-plugin/install.sh
          grep -q 'armv7l' router-plugin/install.sh
          grep -q 'import_from_clipboard' router-plugin/webs/Module_magictier.asp
          grep -q 'import_config_text' router-plugin/webs/Module_magictier.asp
          grep -q 'show_config' router-plugin/webs/Module_magictier.asp
          grep -q 'download_config_text' router-plugin/webs/Module_magictier.asp
          grep -q 'OLD_NETWORK_SECRET' router-plugin/install.sh
          grep -q '升级后将原样保留' router-plugin/install.sh
          ! grep -q 'dbus remove magictier' router-plugin/install.sh
          grep -q -- '--hostname' router-plugin/scripts/magictier_config.sh
          grep -q -- '--instance-name' router-plugin/scripts/magictier_config.sh
          grep -q 'MAGICTIER_USER_EVENT_LOG' router-plugin/scripts/magictier_config.sh
          grep -q 'magictier_internal.log' router-plugin/scripts/magictier_config.sh
          grep -q '组网状态日志' router-plugin/webs/Module_magictier.asp
          grep -q '已成功加入网络' magictier/src/instance_manager.rs
          test "$(cat router-plugin/version)" = "1.0.4"
          grep -q '"version": "1.0.4"' router-plugin/config.json.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('router-plugin/webs/Module_magictier.asp', 'utf8');
          const scripts = [...html.matchAll(/<script type="text\/javascript">([\s\S]*?)<\/script>/g)];
          const app = scripts.map(x => x[1]).find(x => x.includes('var db_magictier'));
          if (!app) throw new Error('MagicTier inline JavaScript not found');
          const fields = {
            magictier_hostname: {value: 'router-a'},
            magictier_instance_name: {value: 'default'},
            magictier_network_name: {value: 'company_vpn'},
            magictier_network_secret: {value: 'sec\\ret"1'},
            magictier_ipv4: {value: '10.126.126.50/24'},
            magictier_listeners: {value: 'tcp://0.0.0.0:11010,udp://0.0.0.0:11010'},
            magictier_peers: {value: 'reality://1.2.3.4:443,tcp://5.6.7.8:11010'},
            magictier_proxy_networks: {value: '192.168.50.0/24,10.8.0.0/24'}
          };
          global.document = {getElementById: id => fields[id] || {}};
          global.navigator = {};
          global.window = {};
          global.alert = () => {};
          eval(app);
          const expectedSecret = fields.magictier_network_secret.value;
          const exported = build_config_text();
          Object.values(fields).forEach(x => x.value = '');
          if (!import_config_text(exported)) throw new Error('exported config cannot be imported');
          if (fields.magictier_network_name.value !== 'company_vpn') throw new Error('network name round-trip failed');
          if (fields.magictier_network_secret.value !== expectedSecret) throw new Error('network secret round-trip failed');
          if (fields.magictier_listeners.value !== 'tcp://0.0.0.0:11010,udp://0.0.0.0:11010') throw new Error('listeners round-trip failed');
          if (fields.magictier_peers.value !== 'reality://1.2.3.4:443,tcp://5.6.7.8:11010') throw new Error('peers round-trip failed');
          if (fields.magictier_proxy_networks.value !== '192.168.50.0/24,10.8.0.0/24') throw new Error('proxy networks round-trip failed');
          NODE

      - name: Create router packages
        run: |
          set -eux
          rm -rf DIST
          mkdir -p DIST/TUF-BE3600-V2/magictier DIST/RT-AX86U/magictier

          cp -a router-plugin/. DIST/TUF-BE3600-V2/magictier/
          cp -a router-plugin/. DIST/RT-AX86U/magictier/
          mkdir -p DIST/TUF-BE3600-V2/magictier/bin DIST/RT-AX86U/magictier/bin

          install -m 0755 magictier/target/armv7-unknown-linux-musleabihf/router/magictier-core DIST/TUF-BE3600-V2/magictier/bin/
          install -m 0755 magictier/target/aarch64-unknown-linux-musl/router/magictier-core DIST/RT-AX86U/magictier/bin/

          chmod 0755 DIST/*/magictier/install.sh DIST/*/magictier/uninstall.sh DIST/*/magictier/scripts/magictier_config.sh DIST/*/magictier/scripts/magictier_health.sh
          printf '%s\n' 'TUF-BE3600 V2 / TUF_3600_V2 (ARMv7)' > DIST/TUF-BE3600-V2/magictier/target-model.txt
          printf '%s\n' 'RT-AX86U (ARM64)' > DIST/RT-AX86U/magictier/target-model.txt

          tar -C DIST/TUF-BE3600-V2 -czf DIST/magictier-TUF-BE3600-V2-koolcenter-armv7.tar.gz magictier
          tar -C DIST/RT-AX86U -czf DIST/magictier-RT-AX86U-koolcenter-arm64.tar.gz magictier

          for pkg in DIST/*.tar.gz; do
            echo "Checking ${pkg}"
            tar -tzf "${pkg}" | grep -qx 'magictier/install.sh'
            tar -tzf "${pkg}" | grep -qx 'magictier/.valid'
            tar -tzf "${pkg}" | grep -qx 'magictier/bin/magictier-core'
            ! tar -tzf "${pkg}" | grep -q 'magictier/bin/magictier-cli'
            tar -tzf "${pkg}" | grep -qx 'magictier/scripts/magictier_config.sh'
            tar -tzf "${pkg}" | grep -qx 'magictier/webs/Module_magictier.asp'
          done

          sha256sum DIST/*.tar.gz > DIST/SHA256SUMS.txt
          ls -lh DIST/*.tar.gz DIST/SHA256SUMS.txt
          stat -c '%n bytes=%s' DIST/*.tar.gz

      - name: Upload router packages
        uses: actions/upload-artifact@v4
        with:
          name: magic-merlin-asus-router
          path: |
            DIST/*.tar.gz
            DIST/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
